# Customer Entity
entity: customer

# Enhanced source configuration (also supports simple string: "analytics.customers")
source:
  name: analytics.customers
  type: table
  database: postgres_prod
  db_schema: analytics
  connection: primary_db

keys:
  - customer_id

properties:
  - name: customer_id
    type: string
    required: true
    description: Unique customer identifier

  - name: name
    type: string
    required: true
    description: Customer full name

  - name: email
    type: string
    required: true
    description: Customer email address

  - name: region
    type: string
    description: Geographic region

  - name: created_at
    type: datetime
    description: Account creation timestamp

description: Represents a customer in the system
