# Product Entity
entity: product

# Simple source format (backward compatible)
source: analytics.products

keys:
  - product_id

properties:
  - name: product_id
    type: string
    required: true
    description: Unique product identifier

  - name: name
    type: string
    required: true
    description: Product name

  - name: category
    type: string
    description: Product category

  - name: price
    type: float
    description: Product price in USD

  - name: in_stock
    type: boolean
    default: true
    description: Whether product is currently in stock

description: Represents a product in the catalog
