name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'grai/**'
  workflow_dispatch:

jobs:
  build-example-docs:
    name: Build Example Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install grai.build
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Create example project
        run: |
          mkdir example-project
          cd example-project
          grai init --name example-graph

      - name: Generate documentation
        run: |
          cd example-project
          grai docs --output ../docs-output

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: example-docs
          path: docs-output/

