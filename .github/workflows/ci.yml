name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest --cov=grai --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting with Black
        run: black --check grai/

      - name: Lint with Ruff
        run: ruff check grai/

      - name: Type check with mypy
        run: mypy grai/
        continue-on-error: true # Don't fail CI on mypy errors initially

  validate:
    name: Validate Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Install built package
        run: pip install dist/*.whl

      - name: Test CLI is available
        run: |
          grai --version
          grai --help

  integration:
    name: Integration Tests with Neo4j
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Wait for Neo4j
        run: |
          python - <<'PY'
          import socket
          import time

          host = "localhost"
          port = 7687
          deadline = time.time() + 60

          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=2):
                      break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit("Neo4j did not become ready in time")
          PY

      - name: Run Neo4j integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: testpassword
        run: |
          pytest -m neo4j_integration -v

      - name: Test grai init
        run: |
          mkdir test-project
          cd test-project
          grai init --name test-graph

      - name: Test grai validate
        run: |
          cd test-project
          grai validate

      - name: Test grai build
        run: |
          cd test-project
          grai build

      - name: Test grai run with Neo4j
        run: |
          cd test-project
          grai run --uri bolt://localhost:7687 --user neo4j --password testpassword --schema-only

      - name: Test grai docs
        run: |
          cd test-project
          grai docs --output ./docs-output

      - name: Verify docs were generated
        run: |
          cd test-project
          test -f docs-output/index.html
          test -f docs-output/entities.html
          test -f docs-output/relations.html
          test -f docs-output/graph.html
          test -f docs-output/lineage.html
