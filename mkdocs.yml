site_name: grai.build
site_url: https://grai.build/
site_description: Declarative knowledge graph modeling tool inspired by dbt
site_author: grai.build
repo_url: https://github.com/asantora05/grai.build
repo_name: asantora05/grai.build
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/asantora05/grai.build
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/grai-build/
  version:
    provider: mike
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/asantora05/grai.build/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">opening an issue</a>.

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: GETTING_STARTED.md
      - Neo4j Setup: NEO4J_SETUP.md
      - Philosophy: PHILOSOPHY.md
  - User Guide:
      - CLI Reference: CLI.md
      - CLI Usage: CLI_USAGE.md
      - Parser: PARSER.md
      - Validator: VALIDATOR.md
      - Compiler: COMPILER.md
  - Advanced Features:
      - Build Cache: CACHE.md
      - Lineage Tracking: LINEAGE.md
      - Visualization: VISUALIZER.md
      - Source Configuration: SOURCE_CONFIG.md
      - Enhanced Sources: ENHANCED_SOURCES.md
      - Data Loading: DATA_LOADING.md
  - Development:
      - Progress: PROGRESS.md
      - CI/CD: CI_CD.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js
