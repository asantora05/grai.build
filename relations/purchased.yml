# PURCHASED Relation
relation: PURCHASED
from: customer
to: product
source: analytics.orders

mappings:
  from_key: customer_id
  to_key: product_id

properties:
  - name: order_id
    type: string
    required: true
    description: Unique order identifier

  - name: order_date
    type: datetime
    required: true
    description: When the order was placed

  - name: quantity
    type: integer
    default: 1
    description: Number of items purchased

  - name: total_amount
    type: float
    description: Total order amount in USD

description: Represents a customer purchasing a product
